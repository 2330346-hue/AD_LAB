<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Student Access Portal</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <h2>Welcome Back</h2>
        <p class="subtitle" style="color: #64748B; margin-bottom: 24px; font-size: 0.95rem;">Sign in to access your portal</p>
        
        <div id="error-box" class="error-msg" style="display:none"></div>
        
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            
            <div class="captcha-box">
                <div id="captchaImg" onclick="loadCaptcha()" style="cursor: pointer;"></div>
                <input type="text" id="captchaInput" placeholder="Enter Code" required>
            </div>
            
            <button type="submit" class="btn-primary">Sign In</button>
        </form>
        
        <p class="footer-link">New to SentryPortal? <a href="/register.html">Create an account</a></p>
    </div>
    <script src="/js/auth.js"></script>
</body>
</html>
