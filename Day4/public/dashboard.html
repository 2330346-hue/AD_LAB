<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Student Access Portal</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
</head>
<body class="dashboard-body">
    <nav class="sidebar">
        <div class="logo">Student Access Portal</div>
        <div id="nav-user" class="user-badge"></div>
        <button onclick="logout()" class="logout-btn">
            <i class="fas fa-sign-out-alt" style="margin-right: 8px;"></i>Logout
        </button>
    </nav>
    
    <main class="main-content">
        <h1>Welcome, <span id="user-name"></span>!</h1>
        
        <div class="grid">
            <div class="card">
                <h3>
                    <i class="fas fa-user-edit" style="color: #FF6B35; margin-right: 8px;"></i>
                    Update Profile
                </h3>
                <form action="/api/update-profile" method="POST" enctype="multipart/form-data">
                    <input type="text" name="username" id="edit-username" placeholder="Username">
                    <input type="email" name="email" id="edit-email" placeholder="Email">
                    
                    <label>
                        <i class="fas fa-file-pdf" style="color: #FF6B35; margin-right: 6px;"></i>
                        Resume (PDF)
                    </label>
                    <input type="file" name="resume" accept=".pdf">
                    
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-save" style="margin-right: 8px;"></i>Save Profile
                    </button>
                </form>
            </div>
            
            <div class="card">
                <h3>
                    <i class="fas fa-graduation-cap" style="color: #DC2626; margin-right: 8px;"></i>
                    Academic Grades
                </h3>
                <table>
                    <thead>
                        <tr>
                            <th>Subject</th>
                            <th>Grade</th>
                        </tr>
                    </thead>
                    <tbody id="grade-table">
                        <tr>
                            <td colspan="2" style="text-align:center; color: #64748B;">
                                <i class="fas fa-spinner fa-spin" style="margin-right: 8px;"></i>Loading...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    
    <script src="/js/dashboard.js"></script>
</body>
</html>
